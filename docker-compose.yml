name: copilot-cli-relay

services:
  proxy:
    build:
      context: .
      target: production
    image: ${RELAY_IMAGE:-copilot-cli-relay:0.6.0}
    container_name: copilot-cli-relay
    env_file:
      - .env
    ports:
      # Bind only to host loopback. Inside the container, uvicorn listens on 0.0.0.0:4141
      # so the Docker publish can reach it; the host-side bind keeps it off the network.
      - "127.0.0.1:4141:4141"
    healthcheck:
      # Cheap local liveness only. Per-protocol readiness lives at /codex/readyz
      # and /claude/readyz; neither readiness nor liveness is an inference test.
      # Python is already in the image, so no curl/wget installation is needed.
      # Compose does not restart unhealthy/stuck containers automatically;
      # restart: unless-stopped applies when the container exits.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4141/livez', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # `unless-stopped` so the proxy survives Docker Desktop / host reboots
    # without manual `docker compose up`. `docker compose down` and Ctrl-C
    # still stop it cleanly. Crashes are visible in `docker compose logs`.
    restart: unless-stopped
